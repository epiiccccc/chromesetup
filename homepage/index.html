<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Mijn startpagina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <div class="mark">C</div>
      <span class="brand">CHROME SETUP</span>
      <span class="date" id="date"></span>
    </header>
    <section class="hero">
      <p class="eyebrow">WELKOM TERUG</p>
      <h1>Waar wil je<br><span>naartoe?</span></h1>
      <form action="https://www.google.com/search" method="get" class="search">
        <span aria-hidden="true">⌕</span>
        <input name="q" type="search" placeholder="Zoeken op Google..." autofocus>
        <button type="submit">Zoeken</button>
      </form>
    </section>
    <section class="links" aria-label="Snelkoppelingen">
      <a href="https://www.youtube.com"><b class="youtube">▶</b><span>YouTube</span></a>
      <a href="https://mail.google.com"><b class="gmail">M</b><span>Gmail</span></a>
      <a href="https://drive.google.com"><b class="drive">▲</b><span>Drive</span></a>
      <a href="https://classroom.google.com"><b class="classroom">▣</b><span>Classroom</span></a>
      <a href="https://www.wikipedia.org"><b class="wiki">W</b><span>Wikipedia</span></a>
    </section>
    <footer>Een rustige plek om te beginnen.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
